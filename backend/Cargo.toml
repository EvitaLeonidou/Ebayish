[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "backend"

[features]
default = []
image-processing = ["image"]
thumbnails = ["image", "image-processing"]

[dev-dependencies]
tokio = { version = "1.46.1", features = ["rt", "macros"] }
wiremock = "0.5"
bytes = "1.0"
mime_guess = "2.0"
 

[dependencies]
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3"
tracing-log = "0.1"
tracing-actix-web = "0.5"
once_cell = "1"
secrecy = { version = "0.8", features = ["serde"] }
config = "0.15"
actix-web = { version = "4.8", features = ["rustls"] }
chrono = { version = "0.4.41", features = ["serde"] }
dotenvy = "0.15.7"
rust_decimal = "1.37.2"
bigdecimal = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "bigdecimal"] }
tokio = { version = "1.46.1", features = ["full"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
unicode-segmentation = "1"
claim = "0.5" 
validator = "0.2"
fake = "4.3.0"
serde-aux = "3"
linkify = "0.8"
rand = { version = "0.8", features=["std_rng"] }
thiserror = "1"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "8"
reqwest = {version = "0.11", features = ["json"]}
rustls = "0.20"
rustls-pemfile = "1.0"
actix = "0.13"
actix-web-actors = "4.2"
actix-multipart = "0.6"
actix-files = "0.6"
futures-util = "0.3"
tokio-tungstenite = "0.20"
mime = "0.3"
image = { version = "0.24", optional = true, features = ["jpeg", "png", "webp"] }
